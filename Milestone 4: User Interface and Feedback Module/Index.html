<!DOCTYPE html>
<html>

<head>

<title>AI Gesture Volume Control</title>

<link rel="stylesheet" href="/static/style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<h1>AI Gesture Volume Control Dashboard</h1>

<div class="main">

<div class="left">

<div class="camera">
<img src="/video">
</div>

<div class="controls">

<button onclick="startCamera()">Start Camera</button>
<button onclick="pauseCamera()">Pause Camera</button>

</div>

<div class="card">

<h3>Gesture</h3>
<p id="gesture">None</p>

</div>

<div class="card">

<h3>Gesture Recognition</h3>
<p id="gesture_recognition">None</p>

</div>

</div>

<div class="dashboard">

<div class="card">

<h2>Volume</h2>

<h1 id="volume">0%</h1>

</div>

<div class="card">

<p>Distance : <span id="distance"></span></p>

<p>FPS : <span id="fps"></span></p>

<p>Hands Detected : <span id="hands"></span></p>

</div>

<div class="card">

<h3>Volume History</h3>

<canvas id="volumeChart"></canvas>

</div>

<div class="card">

<h3>Distance vs Time</h3>

<canvas id="distanceChart"></canvas>

</div>

</div>

</div>

<script src="/static/script.js"></script>

</body>

</html>
